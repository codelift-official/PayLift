<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sahayakBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="45%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#C62828" />
    </linearGradient>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF0F0" />
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#991B1B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Ambient Card Shadow & Base Squircle with Gradient -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#sahayakBg)" filter="url(#softShadow)" />

  <!-- Subtle Top-Edge Specular Glass Light -->
  <path d="M 18 5.5 H 46 C 52 5.5, 57 9.5, 58.5 17" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Bold Modern 'S' for Sahayak -->
  <text x="32" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="36" fill="url(#glyphGrad)" text-anchor="middle" letter-spacing="-1">S</text>
</svg>
